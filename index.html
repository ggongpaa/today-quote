<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#fffdf7">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>오늘의 명언 뽑기</title>

  <style>
    /*
      [크기 계산 방식]
      삼성인터넷 등 일부 브라우저는 vh/dvh/svh 단위나 미디어쿼리를 다르게 해석해서
      화면이 작게 보이는 문제가 있습니다.
      그래서 JS가 실제 보이는 영역(--app-w, --app-h)을 측정해서 넣어주고,
      CSS는 그 값을 기준으로 카드 크기를 계산합니다. (JS가 없으면 vw/vh로 대체)
    */
    :root {
      --app-w: 100vw;
      --app-h: 100vh;
      --pad: 12px;
      --card-ratio: .64;                       /* 가로/세로 비율 */
      --card-w: min(
        calc(var(--app-w) - var(--pad) * 2),   /* 화면 가로에 꽉 차게 */
        480px,                                 /* 태블릿/PC 최대 폭 */
        calc((var(--app-h) - 170px) * var(--card-ratio))  /* 세로가 모자라면 세로에 맞춤 */
      );
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background: #fffdf7;
      color-scheme: light;
    }
    body {
      margin: 0;
      width: 100%;
      min-height: var(--app-h);
      background: radial-gradient(circle at 50% 22%, #fffdf7 0%, #f5f1e8 50%, #e6e6d8 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: #39443b;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      min-height: var(--app-h);
      padding: max(14px, env(safe-area-inset-top)) var(--pad) max(14px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .title {
      font-family: "Noto Serif KR", "Batang", serif;
      font-size: clamp(25px, 7vw, 35px);
      font-weight: 600;
      letter-spacing: -1.4px;
      color: #405143;
      margin-bottom: 6px;
    }
    .subtitle {
      font-family: "Noto Serif KR", "Batang", serif;
      font-size: clamp(13px, 3.6vw, 16px);
      color: #777b74;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    /* ===== 카드 영역 ===== */
    .tarot-area {
      width: 100%;
      flex: 1 1 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1400px;
      position: relative;
    }

    /* 뒷면 카드와 명언 카드는 같은 크기 */
    .tarot-card,
    .quote-reveal {
      width: var(--card-w);
      height: calc(var(--card-w) / var(--card-ratio));
    }

    .tarot-card {
      position: relative;
      transform-style: preserve-3d;
      filter: drop-shadow(0 20px 25px rgba(57,68,59,.22));
      transition: opacity .75s ease, transform .75s ease, filter .75s ease;
      will-change: transform;
    }
    .tarot-card.shaking { animation: shakeCard .12s ease-in-out infinite alternate; }
    @keyframes shakeCard {
      from { transform: translateX(-3px) rotate(-1.1deg); }
      to   { transform: translateX(3px) rotate(1.1deg); }
    }
    .tarot-card.revealing { animation: cardDissolve .8s ease forwards; pointer-events: none; }
    @keyframes cardDissolve {
      0%   { opacity: 1;   transform: scale(1) rotate(0deg);    filter: drop-shadow(0 20px 25px rgba(57,68,59,.22)) blur(0); }
      45%  { opacity: .75; transform: scale(.96) rotate(-2deg); filter: drop-shadow(0 10px 15px rgba(57,68,59,.12)) blur(1px); }
      100% { opacity: 0;   transform: scale(.72) rotate(2deg);  filter: blur(7px); }
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 23px;
      overflow: hidden;
    }
    .card-front {
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.08), transparent 42%),
        linear-gradient(145deg, #4e6b53, #304b38);
      border: 7px solid #f5ead0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-front::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(247,235,198,.82);
      border-radius: 16px;
    }
    .card-front::after {
      content: "";
      position: absolute;
      inset: 21px;
      border: 1px solid rgba(247,235,198,.28);
      border-radius: 12px;
    }

    .tarot-art {
      position: relative;
      width: 78%;
      height: 86%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f7edcf;
    }
    .tarot-art::before, .tarot-art::after {
      content: "✦";
      position: absolute;
      color: #eadba9;
      font-size: 17px;
    }
    .tarot-art::before { top: 5%; left: 8%; }
    .tarot-art::after { bottom: 5%; right: 8%; }
    .moon { font-size: 42px; line-height: 1; margin-bottom: 20px; text-shadow: 0 0 14px rgba(250,239,201,.2); }
    .sun { font-size: 50px; line-height: 1; margin: 5px 0 22px; }
    .leaf-line { font-size: 25px; letter-spacing: 10px; transform: rotate(-8deg); opacity: .9; }
    .leaf-line.bottom { transform: rotate(172deg); margin-top: 18px; }
    .tiny-stars { font-size: 12px; letter-spacing: 7px; opacity: .9; }

    /* ===== 명언 카드 ===== */
    .quote-reveal {
      position: absolute;
      inset: 0;
      margin: auto;                 /* 카드 영역 정중앙 */
      border-radius: 28px;
      background: #fffdf8;
      border: 1px solid #ded8ca;
      box-shadow: 0 20px 30px rgba(57,68,59,.16), inset 0 0 0 1px rgba(255,255,255,.65);
      text-align: center;
      opacity: 0;
      transform: translateY(12px) scale(.94);
      pointer-events: none;
      transition: opacity .8s ease, transform .8s cubic-bezier(.2,.75,.25,1);
    }
    .quote-reveal::before {
      content: "";
      position: absolute;
      inset: 13px;
      border: 1px solid #b7bcae;
      border-radius: 17px;
      pointer-events: none;
    }
    .quote-reveal.visible { opacity: 1; transform: translateY(0) scale(1); }

    /*
      [명언 카드 내부 배치]
      - 명언 블록(.card-body): 카드의 가로·세로 정중앙
      - 날짜(.card-date): 카드 상단 가운데 (명언 위쪽)
      위·아래 여백(padding)을 똑같이 주어 명언이 정확히 중앙에 오도록 함
    */
    #result {
      position: absolute;
      inset: 0;
      z-index: 2;
      padding: calc(var(--card-w) * .2) calc(var(--card-w) * .09);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-date {
      position: absolute;
      top: calc(var(--card-w) * .095);
      left: 0;
      right: 0;
      text-align: center;
      font-size: clamp(16px, calc(var(--card-w) * .052), 24px);
      font-weight: 700;
      color: #405143;
      letter-spacing: -0.5px;
      line-height: 1;
      margin: 0;
    }

    .card-body {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .quote-mark { font-family: Georgia, serif; font-size: 36px; line-height: .6; color: #71866d; margin-bottom: 10px; }
    .message {
      font-size: clamp(15px, calc(var(--card-w) * .05), 22px);
      line-height: 1.7;
      font-weight: 500;
      color: #39443b;
      word-break: keep-all;
      margin-bottom: 12px;
    }
    .author { font-size: 12px; color: #777b74; margin-bottom: 10px; }
    .category { display: inline-block; padding: 5px 12px; border-radius: 20px; background: #e5ebe1; color: #5d6c5a; font-size: 11px; }

    .reveal-content .card-date,
    .reveal-content .quote-mark,
    .reveal-content .message,
    .reveal-content .author,
    .reveal-content .category { animation: quoteAppear .7s ease both; }
    .reveal-content .card-date { animation-delay: .05s; }
    .reveal-content .quote-mark { animation-delay: .12s; }
    .reveal-content .message { animation-delay: .20s; }
    .reveal-content .author { animation-delay: .32s; }
    .reveal-content .category { animation-delay: .42s; }
    @keyframes quoteAppear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .notice { min-height: 43px; font-size: 12px; line-height: 1.7; color: #858a82; padding: 2px 10px; transition: opacity .7s ease, transform .7s ease; }
    .title, .subtitle { transition: opacity .75s ease, transform .75s ease, filter .75s ease; }
    .title.disappearing, .subtitle.disappearing {
      opacity: 0; transform: translateY(-8px) scale(.98); filter: blur(4px); pointer-events: none;
    }
    .notice.disappearing { opacity: 0; transform: translateY(-6px); filter: blur(3px); pointer-events: none; }
    .notice.today-complete { opacity: 1; transform: translateY(0); filter: none; color: #66735f; font-weight: 500; padding-top: 8px; }
    .loading, .error { font-size: 13px; color: #888; line-height: 1.7; }
    .error { color: #a05b5b; }

    .sparkles { position: absolute; inset: 0; pointer-events: none; }
    .sparkle { position: absolute; color: #a68e52; opacity: 0; animation: sparkle 2.4s ease-in-out infinite; }
    .s1 { left: 18%; top: 23%; animation-delay: .2s; } .s2 { right: 17%; top: 32%; animation-delay: .7s; }
    .s3 { left: 23%; bottom: 20%; animation-delay: 1.1s; } .s4 { right: 22%; bottom: 27%; animation-delay: 1.5s; }
    @keyframes sparkle { 0%,100% { opacity: 0; transform: scale(.7); } 45% { opacity: .7; transform: scale(1); } }

    /* 다크모드여도 항상 라이트 유지 */
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #fffdf7; color-scheme: light; }
      .quote-reveal { background: #fffdf8; color: #39443b; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tarot-card.shaking, .sparkle { animation: none; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="title" id="pageTitle">오늘의 명언을 뽑아보세요</div>
    <div class="subtitle" id="waitingMessage">잠시만 기다려주세요. 오늘의 한마디를 준비하고 있어요.</div>

    <section class="tarot-area" aria-label="오늘의 타로 카드">
      <div class="sparkles" aria-hidden="true">
        <span class="sparkle s1">✦</span><span class="sparkle s2">✧</span>
        <span class="sparkle s3">✦</span><span class="sparkle s4">✧</span>
      </div>

      <div class="tarot-card shaking" id="tarotCard" aria-label="오늘의 카드">
        <div class="card-face card-front">
          <div class="tarot-art">
            <div class="tiny-stars">✦ · ✧ · ✦</div>
            <div class="leaf-line">❧ ❧</div>
            <div class="moon">☾</div>
            <div class="sun">✦</div>
            <div class="leaf-line bottom">❧ ❧</div>
            <div class="tiny-stars">✦ · ✧ · ✦</div>
          </div>
        </div>
      </div>

      <div class="quote-reveal" id="quoteReveal" aria-live="polite">
        <div id="result"><div class="loading">명언을 준비하고 있어요...</div></div>
      </div>
    </section>

    <div class="notice" id="notice">카드가 살짝 흔들린 뒤, 오늘의 한마디가 나타나요.</div>
  </main>

  <script>
    /* ===== 실제 화면 크기 측정 (삼성인터넷 등 모든 모바일 브라우저 대응) ===== */
    function setViewportVars() {
      const vv = window.visualViewport;
      const w = Math.round(document.documentElement.clientWidth || window.innerWidth || (vv && vv.width) || 360);
      const h = Math.round(window.innerHeight || (vv && vv.height) || document.documentElement.clientHeight || 640);
      const root = document.documentElement.style;
      root.setProperty("--app-w", w + "px");
      root.setProperty("--app-h", h + "px");
    }
    setViewportVars();
    window.addEventListener("resize", setViewportVars);
    window.addEventListener("orientationchange", () => setTimeout(setViewportVars, 200));
    window.addEventListener("pageshow", setViewportVars);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", setViewportVars);
    // 주소창이 늦게 사라지는 브라우저를 위해 로드 직후 몇 번 더 측정
    [100, 400, 1000].forEach(t => setTimeout(setViewportVars, t));

    /* ===== 명언 로직 ===== */
    const STORAGE_KEY = "today_quote_result";
    const tarotCard = document.getElementById("tarotCard");
    const quoteReveal = document.getElementById("quoteReveal");
    const resultElement = document.getElementById("result");
    const noticeElement = document.getElementById("notice");
    const waitingMessage = document.getElementById("waitingMessage");
    const pageTitle = document.getElementById("pageTitle");

    let quotes = [];
    let quotesLoaded = false;
    let revealStarted = false;

    // YYYY-MM-DD
    function getTodayKey() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    // yyyy년 mm월 dd일 (화) 형식
    function getTodayFormatted() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
      return `${year}년 ${month}월 ${day}일 (${dayNames[now.getDay()]})`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showQuote(quote) {
      resultElement.classList.remove("reveal-content");
      resultElement.innerHTML = `
        <div class="card-date">${getTodayFormatted()}</div>
        <div class="card-body">
          <div class="quote-mark">“</div>
          <div class="message">${escapeHtml(quote.text)}</div>
          <div class="author">— ${escapeHtml(quote.author)}</div>
          ${quote.category ? `<div class="category">${escapeHtml(quote.category)}</div>` : ""}
        </div>
      `;
      void resultElement.offsetWidth;
      resultElement.classList.add("reveal-content");
    }

    function getSavedResult() {
      let saved = null;
      try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
      if (!saved) return null;
      try {
        const data = JSON.parse(saved);
        return data.date === getTodayKey() ? data.quote : null;
      } catch (error) {
        console.warn("저장된 명언 확인 오류:", error);
        return null;
      }
    }

    function saveQuote(quote) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: getTodayKey(), quote }));
      } catch (e) { /* 저장 불가 환경이면 무시 */ }
    }

    function revealQuote(quote) {
      if (revealStarted) return;
      revealStarted = true;

      pageTitle.classList.add("disappearing");
      waitingMessage.classList.add("disappearing");
      noticeElement.classList.add("disappearing");

      showQuote(quote);

      tarotCard.classList.remove("shaking");
      tarotCard.classList.add("revealing");

      setTimeout(() => { quoteReveal.classList.add("visible"); }, 620);

      setTimeout(() => {
        tarotCard.style.visibility = "hidden";
        noticeElement.classList.remove("disappearing");
        noticeElement.classList.add("today-complete");
        noticeElement.textContent = "오늘의 한마디는 하루에 한 번만 만날 수 있어요. 내일 다시 만나요.";
      }, 900);
    }

    function waitAndReveal() {
      if (revealStarted) return;

      const saved = getSavedResult();
      if (saved) { revealQuote(saved); return; }

      if (!quotesLoaded) { setTimeout(waitAndReveal, 100); return; }

      if (!Array.isArray(quotes) || quotes.length === 0) {
        tarotCard.classList.remove("shaking");
        resultElement.innerHTML = `<div class="error">명언 데이터를 불러오지 못했어요.<br>quotes.json 파일을 확인해주세요.</div>`;
        quoteReveal.classList.add("visible");
        noticeElement.textContent = "명언 데이터를 불러오지 못했어요.";
        return;
      }

      const selectedQuote = quotes[Math.floor(Math.random() * quotes.length)];
      saveQuote(selectedQuote);
      revealQuote(selectedQuote);
    }

    async function loadQuotes() {
      try {
        const response = await fetch(`./quotes.json?ver=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP 오류: ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("quotes.json 형식이 올바르지 않습니다.");
        quotes = data;
      } catch (error) {
        console.error("명언 데이터 불러오기 실패:", error);
        quotes = [];
      } finally {
        quotesLoaded = true;
      }
    }

    loadQuotes();

    window.addEventListener("load", () => { setTimeout(waitAndReveal, 1000); });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(reg => console.log("Service Worker Registered:", reg.scope))
          .catch(err => console.error("Service Worker Registration Failed:", err));
      });
    }
  </script>
</body>
</html>
