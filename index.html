<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#526653">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>오늘의 명언 뽑기</title>

  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; width:100%; min-height:100%; }
    body {
      min-height:100vh;
      background:
        radial-gradient(circle at 50% 22%, #fffdf7 0%, #f5f1e8 50%, #e6e6d8 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;
      color:#39443b;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px 15px 30px;
      overflow-x:hidden;
    }

    body::before, body::after {
      content:"";
      position:fixed;
      width:220px;
      height:220px;
      border-radius:50%;
      filter:blur(55px);
      opacity:.25;
      pointer-events:none;
    }
    body::before { left:-100px; top:-70px; background:#b7c9ad; }
    body::after { right:-110px; bottom:-90px; background:#d7cda9; }

    .container { width:100%; max-width:520px; text-align:center; position:relative; z-index:1; }

    .title {
      font-family:"Noto Serif KR","Batang",serif;
      font-size:clamp(27px,7vw,35px);
      font-weight:600;
      letter-spacing:-1.4px;
      color:#405143;
      margin-bottom:7px;
    }
    .subtitle {
      font-family:"Noto Serif KR","Batang",serif;
      font-size:clamp(13px,3.6vw,16px);
      color:#777b74;
      line-height:1.7;
      margin-bottom:7px;
    }
    .date { font-size:12px; color:#858a82; margin-bottom:18px; }

    /* 카드 영역 */
    .tarot-area {
      width:100%;
      min-height:390px;
      display:flex;
      justify-content:center;
      align-items:center;
      perspective:1400px;
      position:relative;
    }

    .tarot-card {
      width:min(58vw,285px);
      aspect-ratio:.68;
      position:relative;
      transform-style:preserve-3d;
      cursor:default;
      filter:drop-shadow(0 20px 25px rgba(57,68,59,.22));
      transition:transform 1s cubic-bezier(.2,.75,.25,1);
    }

    /* 1초 동안 살짝 흔들린다 */
    .tarot-card.shaking {
      animation:shakeCard .12s ease-in-out infinite alternate;
    }
    @keyframes shakeCard {
      from { transform:translateX(-3px) rotate(-1.1deg); }
      to   { transform:translateX(3px) rotate(1.1deg); }
    }

    /* 자동으로 뒤집힌다 */
    .tarot-card.flipped { transform:rotateY(180deg); }

    .card-face {
      position:absolute;
      inset:0;
      border-radius:23px;
      overflow:hidden;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    /* 타로 카드 뒷면 */
    .card-front {
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.08), transparent 42%),
        linear-gradient(145deg,#4e6b53,#304b38);
      border:7px solid #f5ead0;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .card-front::before {
      content:"";
      position:absolute;
      inset:14px;
      border:1px solid rgba(247,235,198,.82);
      border-radius:16px;
    }
    .card-front::after {
      content:"";
      position:absolute;
      inset:21px;
      border:1px solid rgba(247,235,198,.28);
      border-radius:12px;
    }

    .tarot-art {
      position:relative;
      width:78%;
      height:86%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      color:#f7edcf;
    }
    .tarot-art::before,
    .tarot-art::after {
      content:"✦";
      position:absolute;
      color:#eadba9;
      font-size:17px;
    }
    .tarot-art::before { top:5%; left:8%; }
    .tarot-art::after { bottom:5%; right:8%; }
    .moon { font-size:42px; line-height:1; margin-bottom:20px; text-shadow:0 0 14px rgba(250,239,201,.2); }
    .sun { font-size:50px; line-height:1; margin:5px 0 22px; }
    .leaf-line { font-size:25px; letter-spacing:10px; transform:rotate(-8deg); opacity:.9; }
    .leaf-line.bottom { transform:rotate(172deg); margin-top:18px; }
    .tiny-stars { font-size:12px; letter-spacing:7px; opacity:.9; }

    .tapless {
      position:absolute;
      bottom:31px;
      font-size:10px;
      letter-spacing:2.2px;
      color:#f7edcf;
      opacity:.65;
    }

    /* 명언 앞면 */
    .card-back {
      transform:rotateY(180deg);
      background:linear-gradient(145deg,#fffdf8,#f7f2e7);
      border:1px solid #ded8ca;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px 25px;
      text-align:center;
    }
    .card-back::before {
      content:"";
      position:absolute;
      inset:13px;
      border:1px solid #b7bcae;
      border-radius:17px;
    }
    .card-back::after {
      content:"✦";
      position:absolute;
      top:25px;
      left:50%;
      transform:translateX(-50%);
      color:#a68e52;
      font-size:17px;
    }
    #result { width:100%; position:relative; z-index:2; }
    .quote-mark { font-family:Georgia,serif; font-size:52px; line-height:.6; color:#71866d; margin-bottom:17px; }
    .message { font-size:clamp(15px,4.2vw,19px); line-height:1.8; font-weight:500; color:#39443b; word-break:keep-all; margin-bottom:18px; }
    .author { font-size:12px; color:#777b74; margin-bottom:12px; }
    .category { display:inline-block; padding:6px 13px; border-radius:20px; background:#e5ebe1; color:#5d6c5a; font-size:11px; }

    .reveal-content .quote-mark,
    .reveal-content .message,
    .reveal-content .author,
    .reveal-content .category { animation:quoteAppear .7s ease both; }
    .reveal-content .message { animation-delay:.12s; }
    .reveal-content .author { animation-delay:.25s; }
    .reveal-content .category { animation-delay:.38s; }
    @keyframes quoteAppear { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    .notice { min-height:43px; font-size:12px; line-height:1.7; color:#858a82; padding:2px 10px; }
    .loading,.error { font-size:13px; color:#888; line-height:1.7; }
    .error { color:#a05b5b; }

    .sparkles { position:absolute; inset:0; pointer-events:none; }
    .sparkle { position:absolute; color:#a68e52; opacity:0; animation:sparkle 2.4s ease-in-out infinite; }
    .s1{left:18%;top:23%;animation-delay:.2s}.s2{right:17%;top:32%;animation-delay:.7s}.s3{left:23%;bottom:20%;animation-delay:1.1s}.s4{right:22%;bottom:27%;animation-delay:1.5s}
    @keyframes sparkle { 0%,100%{opacity:0;transform:scale(.7)} 45%{opacity:.7;transform:scale(1)} }

    @media(max-width:430px){
      body{padding-top:18px}
      .date{margin-bottom:8px}
      .tarot-area{min-height:350px}
      .tarot-card{width:min(62vw,270px)}
      .message{font-size:16px}
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="title">오늘의 명언을 뽑아보세요</div>
    <div class="subtitle">잠시만 기다려주세요. 오늘의 한마디를 준비하고 있어요.</div>
    <div class="date" id="today"></div>

    <section class="tarot-area" aria-label="오늘의 타로 카드">
      <div class="sparkles" aria-hidden="true">
        <span class="sparkle s1">✦</span><span class="sparkle s2">✧</span>
        <span class="sparkle s3">✦</span><span class="sparkle s4">✧</span>
      </div>

      <div class="tarot-card shaking" id="tarotCard" aria-label="자동으로 뒤집히는 오늘의 카드">
        <div class="card-face card-front">
          <div class="tarot-art">
            <div class="tiny-stars">✦ · ✧ · ✦</div>
            <div class="leaf-line">❧ ❧</div>
            <div class="moon">☾</div>
            <div class="sun">✦</div>
            <div class="leaf-line bottom">❧ ❧</div>
            <div class="tiny-stars">✦ · ✧ · ✦</div>
            <div class="tapless">YOUR MESSAGE FOR TODAY</div>
          </div>
        </div>

        <div class="card-face card-back">
          <div id="result"><div class="loading">명언을 불러오는 중이에요...</div></div>
        </div>
      </div>
    </section>

    <div class="notice" id="notice">카드가 살짝 흔들린 뒤, 저절로 뒤집혀요.</div>
  </main>

  <script>
    const STORAGE_KEY = "today_quote_result";
    const todayElement = document.getElementById("today");
    const tarotCard = document.getElementById("tarotCard");
    const resultElement = document.getElementById("result");
    const noticeElement = document.getElementById("notice");

    let quotes = [];
    let quotesLoaded = false;
    let started = false;

    function getToday() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function displayToday() {
      const [year, month, day] = getToday().split("-");
      todayElement.textContent = `${year}년 ${Number(month)}월 ${Number(day)}일`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showQuote(quote) {
      resultElement.classList.remove("reveal-content");
      resultElement.innerHTML = `
        <div class="quote-mark">“</div>
        <div class="message">${escapeHtml(quote.text)}</div>
        <div class="author">— ${escapeHtml(quote.author)}</div>
        ${quote.category ? `<div class="category">${escapeHtml(quote.category)}</div>` : ""}
      `;
      void resultElement.offsetWidth;
      resultElement.classList.add("reveal-content");
    }

    function getSavedResult() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return null;
      try {
        const data = JSON.parse(saved);
        return data.date === getToday() ? data.quote : null;
      } catch (error) {
        console.log("저장된 데이터 확인 오류:", error);
        return null;
      }
    }

    function saveQuote(quote) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        date: getToday(),
        quote
      }));
    }

    function flipWithQuote(quote) {
      if (started) return;
      started = true;

      showQuote(quote);
      noticeElement.textContent = "오늘의 한마디를 마음에 담아보세요.";
      tarotCard.classList.remove("shaking");

      // 흔들림이 끝난 뒤 150ms 쉬고 카드가 뒤집힌다.
      setTimeout(() => {
        tarotCard.classList.add("flipped");
      }, 150);
    }

    function revealWhenReady() {
      const saved = getSavedResult();
      if (saved) {
        flipWithQuote(saved);
        return;
      }

      if (!quotesLoaded) {
        setTimeout(revealWhenReady, 100);
        return;
      }

      if (!quotes.length) {
        resultElement.innerHTML = `<div class="error">명언 데이터를 불러오지 못했어요.<br>quotes.json 파일을 확인해주세요.</div>`;
        noticeElement.textContent = "명언 데이터를 불러오지 못했어요.";
        tarotCard.classList.remove("shaking");
        return;
      }

      const selectedQuote = quotes[Math.floor(Math.random() * quotes.length)];
      saveQuote(selectedQuote);
      flipWithQuote(selectedQuote);
    }

    async function loadQuotes() {
      try {
        const response = await fetch(`./quotes.json?ver=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP 오류: ${response.status}`);
        quotes = await response.json();
        if (!Array.isArray(quotes)) throw new Error("quotes.json 형식이 올바르지 않습니다.");
        console.log(`명언 ${quotes.length}개를 불러왔습니다.`);
      } catch (error) {
        console.error("명언 데이터 불러오기 실패:", error);
        quotes = [];
      } finally {
        quotesLoaded = true;
      }
    }

    displayToday();
    loadQuotes();

    // 화면이 열린 후 정확히 1초 동안 흔들리고 자동으로 명언을 공개한다.
    window.addEventListener("load", () => {
      setTimeout(revealWhenReady, 1000);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(reg => console.log("Service Worker Registered:", reg.scope))
          .catch(err => console.error("Service Worker Registration Failed:", err));
      });
    }
  </script>
</body>
</html>
