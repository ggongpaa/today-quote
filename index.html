<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>오늘의 명언 뽑기</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    linear-gradient(135deg, #f4f1e8, #e8efe3);

  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

  color: #333;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;
}

.container {
  width: 100%;
  max-width: 480px;

  text-align: center;
}

h1 {
  font-size: 32px;

  margin:
    0 0 8px;

  color: #38513b;
}

.date {
  font-size: 15px;

  color: #888;

  margin-bottom: 8px;
}

.subtitle {
  font-size: 15px;

  color: #777;

  margin-bottom: 25px;
}

.card {
  background: #fffdf7;

  border-radius: 24px;

  padding: 40px 28px;

  min-height: 330px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  box-shadow:
    0 12px 35px
    rgba(0,0,0,0.10);

  border:
    1px solid #e4e0d5;
}

.category {
  display: inline-block;

  margin:
    0 auto 22px;

  padding:
    7px 14px;

  border-radius: 20px;

  background: #e5eee1;

  color: #4d684f;

  font-size: 13px;
}

.quote {
  font-size: 23px;

  line-height: 1.7;

  font-weight: 600;

  word-break: keep-all;

  margin-bottom: 22px;
}

.author {
  font-size: 15px;

  color: #888;
}

.draw-button {
  width: 100%;

  border: none;

  border-radius: 15px;

  padding: 16px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

  margin-top: 15px;

  background: #58745a;

  color: white;
}

.draw-button:active {
  transform: scale(0.98);
}

.draw-button:disabled {

  background: #b8c1b8;

  cursor: default;

  transform: none;
}

.message {

  min-height: 22px;

  margin-top: 12px;

  font-size: 13px;

  color: #777;

  line-height: 1.5;
}

.footer {

  margin-top: 20px;

  font-size: 12px;

  color: #999;
}

</style>
</head>


<body>

<div class="container">

  <h1>오늘의 명언</h1>

  <div class="date" id="today"></div>

  <div class="subtitle">
    지금 당신에게 필요한 한마디를 뽑아보세요
  </div>


  <div class="card">

    <div
      class="category"
      id="category"
    >
      오늘의 마음
    </div>


    <div
      class="quote"
      id="quote"
    >
      오늘 당신에게 필요한<br>
      한마디를 뽑아보세요.
    </div>


    <div
      class="author"
      id="author"
    ></div>

  </div>


  <button
    class="draw-button"
    id="drawButton"
    onclick="drawQuote()"
  >
    ✨ 오늘의 명언 뽑기
  </button>


  <div
    class="message"
    id="message"
  ></div>


  <div class="footer">
    하루에 한 번, 당신에게 필요한 한마디
  </div>

</div>


<script>


/* --------------------------------
   명언 목록
-------------------------------- */

const quotes = [

  {
    text: "시작이 반이다.",
    author: "속담",
    category: "새로운 시작"
  },

  {
    text: "오늘 걷지 않으면 내일은 뛰어야 한다.",
    author: "카를레스 푸욜",
    category: "도전"
  },

  {
    text: "성공은 실패를 거듭해도 열정을 잃지 않는 것이다.",
    author: "윈스턴 처칠",
    category: "힘이 필요해요"
  },

  {
    text: "행복은 준비된 마음에서 시작된다.",
    author: "알 수 없음",
    category: "행복한 하루"
  },

  {
    text: "당신이 할 수 있다고 믿든 할 수 없다고 믿든, 당신이 옳다.",
    author: "헨리 포드",
    category: "도전"
  },

  {
    text: "작은 변화가 큰 차이를 만든다.",
    author: "알 수 없음",
    category: "새로운 시작"
  },

  {
    text: "때로는 천천히 가는 것이 가장 빠른 길이다.",
    author: "알 수 없음",
    category: "위로"
  },

  {
    text: "삶은 우리가 만드는 것이다.",
    author: "엘리너 루스벨트",
    category: "힘이 필요해요"
  },

  {
    text: "어제보다 나은 오늘을 만들면 된다.",
    author: "알 수 없음",
    category: "새로운 시작"
  },

  {
    text: "당신의 가능성에는 끝이 없다.",
    author: "알 수 없음",
    category: "도전"
  },

  {
    text: "가장 어두운 밤도 지나간다.",
    author: "윌리엄 셰익스피어",
    category: "위로"
  },

  {
    text: "사랑은 나눌수록 커진다.",
    author: "알 수 없음",
    category: "사랑"
  },

  {
    text: "오늘이라는 선물에 감사하자.",
    author: "알 수 없음",
    category: "행복한 하루"
  },

  {
    text: "포기하지 않는 사람에게는 끝이 없다.",
    author: "알 수 없음",
    category: "힘이 필요해요"
  },

  {
    text: "당신은 생각보다 훨씬 강하다.",
    author: "알 수 없음",
    category: "위로"
  }

];


/* --------------------------------
   저장에 사용할 이름
-------------------------------- */

const STORAGE_KEY =
  "today_quote_result";


/* --------------------------------
   오늘 날짜
-------------------------------- */

function getToday() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


/* --------------------------------
   화면에 날짜 표시
-------------------------------- */

function showToday() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    now.getMonth() + 1;

  const day =
    now.getDate();

  document.getElementById(
    "today"
  ).textContent =
    `${year}년 ${month}월 ${day}일`;
}


/* --------------------------------
   명언을 화면에 표시
-------------------------------- */

function showQuote(data) {

  document.getElementById(
    "category"
  ).textContent =
    data.category;


  document.getElementById(
    "quote"
  ).textContent =
    "“" + data.text + "”";


  document.getElementById(
    "author"
  ).textContent =
    "— " + data.author;
}


/* --------------------------------
   오늘 뽑은 명언 확인
-------------------------------- */

function checkTodayQuote() {

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (!saved) {

    return;

  }


  try {

    const data =
      JSON.parse(saved);


    /*
      저장된 날짜가 오늘인지 확인
    */

    if (
      data.date === getToday()
    ) {

      showQuote(data);


      document.getElementById(
        "drawButton"
      ).disabled = true;


      document.getElementById(
        "drawButton"
      ).textContent =
        "오늘의 명언을 뽑았습니다";


      document.getElementById(
        "message"
      ).textContent =
        "오늘의 명언은 이미 뽑으셨어요. 내일 다시 만나요 🌿";

    }

  }

  catch (error) {

    localStorage.removeItem(
      STORAGE_KEY
    );

  }

}


/* --------------------------------
   명언 뽑기
-------------------------------- */

function drawQuote() {

  /*
    혹시 오늘 이미 뽑았다면
    다시 뽑지 못하게 함
  */

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (saved) {

    try {

      const data =
        JSON.parse(saved);


      if (
        data.date === getToday()
      ) {

        return;

      }

    }

    catch (error) {

      localStorage.removeItem(
        STORAGE_KEY
      );

    }

  }


  /*
    랜덤 명언 선택
  */

  const randomIndex =
    Math.floor(
      Math.random() *
      quotes.length
    );


  const quote =
    quotes[randomIndex];


  /*
    오늘 날짜와 함께 저장
  */

  const result = {

    date:
      getToday(),

    text:
      quote.text,

    author:
      quote.author,

    category:
      quote.category

  };


  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify(result)

  );


  /*
    화면 표시
  */

  showQuote(result);


  /*
    버튼 잠금
  */

  document.getElementById(
    "drawButton"
  ).disabled = true;


  document.getElementById(
    "drawButton"
  ).textContent =
    "오늘의 명언을 뽑았습니다";


  document.getElementById(
    "message"
  ).textContent =
    "오늘의 명언은 내일 다시 뽑을 수 있어요 🌿";

}


/* --------------------------------
   페이지 시작
-------------------------------- */

showToday();

checkTodayQuote();


</script>

</body>
</html>
