<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>오늘의 명언 뽑기</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#526653">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% 20%,
          #fffdf7 0%,
          #f5f1e8 48%,
          #e8e5da 100%
        );

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;

      color: #39443b;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 28px 15px;
    }


    /* =========================================
       전체
       ========================================= */

    .container {
      width: 100%;
      max-width: 500px;

      text-align: center;
    }


    /* =========================================
       제목
       ========================================= */

    .title {
      font-size: 29px;
      font-weight: 700;

      letter-spacing: -0.8px;

      color: #405143;

      margin-bottom: 7px;
    }


    .subtitle {
      font-size: 14px;

      color: #777b74;

      line-height: 1.7;

      margin-bottom: 10px;
    }


    .date {
      font-size: 13px;

      color: #858a82;

      margin-bottom: 24px;
    }


    /* =========================================
       카드 영역
       ========================================= */

    .card-wrapper {

      width: 100%;

      display: flex;
      justify-content: center;

      perspective: 1400px;

      margin-bottom: 22px;
    }


    /* =========================================
       카드
       ========================================= */

    .quote-card {

      width: min(82vw, 330px);

      aspect-ratio: 0.68;

      position: relative;

      cursor: pointer;

      transform-style: preserve-3d;

      transition:
        transform 0.95s cubic-bezier(
          0.2,
          0.75,
          0.25,
          1
        );

      -webkit-tap-highlight-color: transparent;

      user-select: none;

      filter:
        drop-shadow(
          0 18px 22px rgba(57, 68, 59, 0.18)
        );
    }


    /* 카드가 준비되었을 때 */

    .quote-card.ready {

      animation:
        cardEntrance 0.8s ease-out,
        gentleFloat 3.5s ease-in-out
          1s infinite;
    }


    /* =========================================
       카드 등장
       ========================================= */

    @keyframes cardEntrance {

      from {
        opacity: 0;

        transform:
          translateY(25px)
          scale(0.94)
          rotate(-2deg);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1)
          rotate(0);
      }

    }


    /* =========================================
       카드 살짝 떠 있는 효과
       ========================================= */

    @keyframes gentleFloat {

      0%,
      100% {
        transform:
          translateY(0)
          rotate(0deg);
      }

      50% {
        transform:
          translateY(-7px)
          rotate(0.4deg);
      }

    }


    /* =========================================
       카드 뒤집기
       ========================================= */

    .quote-card.flipped {

      transform:
        rotateY(180deg);

      animation: none;
    }


    /* =========================================
       카드 앞 / 뒤
       ========================================= */

    .card-face {

      position: absolute;

      width: 100%;
      height: 100%;

      top: 0;
      left: 0;

      border-radius: 25px;

      overflow: hidden;

      backface-visibility: hidden;

      -webkit-backface-visibility: hidden;
    }


    /* =========================================
       카드 앞면
       ========================================= */

    .card-front {

      background:

        radial-gradient(
          circle at 50% 42%,
          #728a70 0%,
          #5e755e 43%,
          #465d49 100%
        );

      color: #fffdf5;

      border:
        7px solid rgba(
          255,
          255,
          255,
          0.15
        );

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      padding: 35px;

      box-shadow:
        inset 0 0 0 1px
          rgba(255,255,255,0.2);
    }


    /* =========================================
       카드 안쪽 테두리
       ========================================= */

    .card-front::before {

      content: "";

      position: absolute;

      inset: 14px;

      border:
        1px solid
        rgba(245,238,215,0.45);

      border-radius: 18px;

      pointer-events: none;
    }


    .card-front::after {

      content: "";

      position: absolute;

      inset: 21px;

      border:
        1px solid
        rgba(245,238,215,0.14);

      border-radius: 13px;

      pointer-events: none;
    }


    /* =========================================
       카드 장식
       ========================================= */

    .moon {

      width: 50px;
      height: 50px;

      border-radius: 50%;

      border:
        2px solid
        rgba(247,240,216,0.9);

      position: relative;

      margin-bottom: 27px;

      box-shadow:
        0 0 18px
        rgba(247,240,216,0.12);
    }


    .moon::after {

      content: "";

      position: absolute;

      width: 44px;
      height: 44px;

      border-radius: 50%;

      background: #617961;

      top: -6px;
      left: 10px;
    }


    .stars {

      position: absolute;

      font-size: 14px;

      color:
        rgba(247,240,216,0.8);

      letter-spacing: 14px;
    }


    .star-top {

      top: 43px;
      left: 48px;
    }


    .star-right {

      top: 70px;
      right: 40px;
    }


    .star-bottom {

      bottom: 70px;
      left: 42px;
    }


    .front-title {

      font-size: 28px;

      font-weight: 600;

      letter-spacing: 3px;

      line-height: 1.5;

      margin-bottom: 13px;

      text-shadow:
        0 2px 8px
        rgba(0,0,0,0.12);
    }


    .front-subtitle {

      font-size: 13px;

      letter-spacing: 1px;

      opacity: 0.82;
    }


    .tap-text {

      position: absolute;

      bottom: 31px;

      font-size: 10px;

      letter-spacing: 2.5px;

      opacity: 0.65;
    }


    /* =========================================
       식물 장식
       ========================================= */

    .leaf {

      position: absolute;

      font-size: 21px;

      opacity: 0.45;

      color: #dfe6d7;
    }


    .leaf-1 {
      top: 92px;
      left: 30px;
      transform: rotate(-25deg);
    }

    .leaf-2 {
      bottom: 98px;
      right: 28px;
      transform: rotate(25deg);
    }

    .leaf-3 {
      bottom: 46px;
      right: 65px;
      font-size: 15px;
    }


    /* =========================================
       카드 뒷면
       ========================================= */

    .card-back {

      transform:
        rotateY(180deg);

      background:
        linear-gradient(
          145deg,
          #fffdf8,
          #f7f2e7
        );

      border:
        1px solid #ded8ca;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 32px 27px;

      text-align: center;
    }


    /* 뒷면 테두리 */

    .card-back::before {

      content: "";

      position: absolute;

      inset: 13px;

      border:
        1px solid #b7bcae;

      border-radius: 18px;

      pointer-events: none;
    }


    .card-back::after {

      content: "";

      position: absolute;

      inset: 19px;

      border:
        1px solid #e3ded1;

      border-radius: 14px;

      pointer-events: none;
    }


    /* =========================================
       명언
       ========================================= */

    #result {

      width: 100%;

      position: relative;

      z-index: 2;
    }


    .quote-mark {

      font-family: Georgia, serif;

      font-size: 55px;

      line-height: 0.6;

      color: #71866d;

      margin-bottom: 17px;
    }


    .message {

      font-size: 18px;

      line-height: 1.85;

      font-weight: 500;

      color: #39443b;

      word-break: keep-all;

      margin-bottom: 20px;
    }


    .author {

      font-size: 13px;

      color: #777b74;

      margin-bottom: 12px;
    }


    .category {

      display: inline-block;

      padding: 6px 13px;

      border-radius: 20px;

      background: #e5ebe1;

      color: #5d6c5a;

      font-size: 11px;
    }


    /* =========================================
       명언 등장 효과
       ========================================= */

    .flipped .message {

      animation:
        quoteAppear
        0.8s
        ease-out
        0.35s
        both;
    }


    .flipped .author {

      animation:
        quoteAppear
        0.8s
        ease-out
        0.5s
        both;
    }


    .flipped .category {

      animation:
        quoteAppear
        0.8s
        ease-out
        0.65s
        both;
    }


    @keyframes quoteAppear {

      from {

        opacity: 0;

        transform:
          translateY(12px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* =========================================
       안내 문구
       ========================================= */

    .notice {

      min-height: 45px;

      font-size: 13px;

      line-height: 1.7;

      color: #858a82;
    }


    .loading {

      color: #888;

      font-size: 14px;
    }


    .error {

      color: #a05b5b;

      font-size: 13px;

      line-height: 1.7;
    }


    /* =========================================
       작은 화면
       ========================================= */

    @media (max-width: 400px) {

      body {
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .title {
        font-size: 26px;
      }

      .subtitle {
        font-size: 13px;
      }

      .quote-card {
        width: min(84vw, 305px);
      }

      .message {
        font-size: 16.5px;
        line-height: 1.75;
      }

      .front-title {
        font-size: 26px;
      }

    }


  </style>

</head>


<body>


<div class="container">


  <!-- 제목 -->

  <div class="title">
    오늘의 명언 뽑기
  </div>


  <div class="subtitle">
    오늘의 마음에 필요한 한마디를 뽑아보세요.
  </div>


  <!-- 날짜 -->

  <div
    class="date"
    id="today">
  </div>


  <!-- =======================================
       카드
       ======================================= -->

  <div class="card-wrapper">

    <div
      class="quote-card"
      id="quoteCard">


      <!-- =====================================
           앞면
           ===================================== -->

      <div class="card-face card-front">


        <div class="stars star-top">
          ✦
        </div>


        <div class="stars star-right">
          ✦
        </div>


        <div class="stars star-bottom">
          ✦
        </div>


        <div class="leaf leaf-1">
          ❧
        </div>


        <div class="leaf leaf-2">
          ❧
        </div>


        <div class="leaf leaf-3">
          ❧
        </div>


        <div class="moon"></div>


        <div class="front-title">
          오늘의<br>
          마음
        </div>


        <div class="front-subtitle">
          한 장의 카드를 뽑아보세요
        </div>


        <div class="tap-text">
          TAP TO DRAW
        </div>


      </div>


      <!-- =====================================
           뒷면
           ===================================== -->

      <div class="card-face card-back">


        <div id="result">

          <div class="loading">
            명언을 불러오는 중이에요...
          </div>

        </div>


      </div>


    </div>

  </div>


  <!-- 안내 -->

  <div
    class="notice"
    id="notice">

    카드를 눌러 오늘의 명언을 뽑아보세요.

  </div>


</div>



<script>


  // ==========================================
  // 기본 설정
  // ==========================================

  const STORAGE_KEY =
    "today_quote_result";


  const todayElement =
    document.getElementById("today");


  const resultElement =
    document.getElementById("result");


  const quoteCard =
    document.getElementById("quoteCard");


  const noticeElement =
    document.getElementById("notice");


  let quotes = [];

  let isDrawing = false;



  // ==========================================
  // 오늘 날짜
  // ==========================================

  function getToday() {

    const now = new Date();

    const year =
      now.getFullYear();

    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        now.getDate()
      ).padStart(2, "0");


    return `${year}-${month}-${day}`;

  }



  function displayToday() {

    const today =
      getToday();

    const [
      year,
      month,
      day
    ] = today.split("-");


    todayElement.textContent =
      `${year}년 ${Number(month)}월 ${Number(day)}일`;

  }



  // ==========================================
  // 명언 표시
  // ==========================================

  function showQuote(quote) {

    resultElement.innerHTML = `

      <div class="quote-mark">
        “
      </div>

      <div class="message">
        ${quote.text}
      </div>

      <div class="author">
        — ${quote.author}
      </div>

      ${
        quote.category
        ?
        `<div class="category">
          ${quote.category}
        </div>`
        :
        ""
      }

    `;

  }



  // ==========================================
  // 저장된 오늘의 명언
  // ==========================================

  function getSavedResult() {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (!saved) {
      return null;
    }


    try {

      const data =
        JSON.parse(saved);


      if (
        data.date ===
        getToday()
      ) {

        return data.quote;

      }

    } catch (error) {

      console.log(
        "저장된 데이터 확인 오류:",
        error
      );

    }


    return null;

  }



  // ==========================================
  // 카드 뽑기
  // ==========================================

  function drawQuote() {


    if (isDrawing) {
      return;
    }


    if (
      !quotes ||
      quotes.length === 0
    ) {
      return;
    }


    // 이미 오늘 뽑았는지 확인

    const savedQuote =
      getSavedResult();


    if (savedQuote) {

      showQuote(
        savedQuote
      );

      quoteCard.classList.add(
        "flipped"
      );

      quoteCard.classList.add(
        "disabled"
      );

      noticeElement.textContent =
        "오늘은 이미 명언을 뽑았어요. 내일 다시 만나요.";

      return;

    }


    isDrawing = true;


    // 랜덤 선택

    const randomIndex =
      Math.floor(
        Math.random() *
        quotes.length
      );


    const selectedQuote =
      quotes[randomIndex];


    // 저장

    localStorage.setItem(

      STORAGE_KEY,

      JSON.stringify({

        date: getToday(),

        quote: selectedQuote

      })

    );


    // 뒷면에 명언 준비

    showQuote(
      selectedQuote
    );


    // 카드 뒤집기

    setTimeout(() => {

      quoteCard.classList.add(
        "flipped"
      );


      quoteCard.classList.add(
        "disabled"
      );


      noticeElement.textContent =
        "오늘의 한마디를 마음에 담아보세요.";

      isDrawing = false;

    }, 100);

  }



  // ==========================================
  // quotes.json 불러오기
  // ==========================================

  async function loadQuotes() {

    try {

      const response =
        await fetch(
          "./quotes.json?ver=3"
        );


      if (!response.ok) {

        throw new Error(
          `HTTP 오류: ${response.status}`
        );

      }


      quotes =
        await response.json();


      if (
        !Array.isArray(quotes)
      ) {

        throw new Error(
          "quotes.json 형식이 올바르지 않습니다."
        );

      }


      console.log(
        `명언 ${quotes.length}개를 불러왔습니다.`
      );


      // 오늘 이미 뽑았는지 확인

      const savedQuote =
        getSavedResult();


      if (savedQuote) {

        showQuote(
          savedQuote
        );


        quoteCard.classList.add(
          "flipped"
        );


        quoteCard.classList.add(
          "disabled"
        );


        noticeElement.textContent =
          "오늘은 이미 명언을 뽑았어요. 내일 다시 만나요.";

      }
      else {

        quoteCard.classList.add(
          "ready"
        );


        noticeElement.textContent =
          "카드를 눌러 오늘의 명언을 뽑아보세요.";

      }


    } catch (error) {

      console.error(
        "명언 데이터 불러오기 실패:",
        error
      );


      resultElement.innerHTML = `

        <div class="error">

          명언 데이터를 불러오지 못했어요.<br>
          잠시 후 다시 시도해주세요.

        </div>

      `;


      noticeElement.textContent =
        "quotes.json 파일을 확인해주세요.";

    }

  }



  // ==========================================
  // 카드 클릭
  // ==========================================

  quoteCard.addEventListener(
    "click",
    drawQuote
  );



  // ==========================================
  // 시작
  // ==========================================

  displayToday();

  loadQuotes();



  // ==========================================
  // 서비스 워커
  // ==========================================

  if (
    "serviceWorker" in navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register("./sw.js")

          .then(
            (reg) => {

              console.log(
                "Service Worker Registered:",
                reg.scope
              );

            }
          )

          .catch(
            (err) => {

              console.error(
                "Service Worker Registration Failed:",
                err
              );

            }
          );

      }
    );

  }


</script>


</body>
</html>
