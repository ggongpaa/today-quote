<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>오늘의 명언 뽑기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f1e8;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #3d463d;
    }

    .container {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    .title {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #425443;
    }

    .subtitle {
      font-size: 15px;
      color: #777;
      margin-bottom: 25px;
    }

    .date {
      font-size: 14px;
      color: #7b8178;
      margin-bottom: 18px;
    }

    .card {
      background: #fffdf8;
      border-radius: 22px;
      padding: 40px 28px;
      box-shadow: 0 8px 25px rgba(70, 70, 50, 0.10);
      min-height: 280px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .message {
      font-size: 20px;
      line-height: 1.8;
      font-weight: 500;
      word-break: keep-all;
      margin-bottom: 25px;
    }

    .author {
      font-size: 15px;
      color: #777;
      margin-bottom: 8px;
    }

    .category {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      background: #e8eee5;
      color: #5d6c5a;
      font-size: 12px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      max-width: 300px;

      padding: 15px 20px;

      border: none;
      border-radius: 30px;

      background: #71866d;
      color: white;

      font-size: 17px;
      font-weight: 600;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #b8bdb5;
      cursor: default;
    }

    .notice {
      margin-top: 16px;
      font-size: 13px;
      color: #888;
      line-height: 1.6;
    }

    .loading {
      color: #888;
      font-size: 15px;
    }

    .error {
      color: #a05b5b;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="title">오늘의 명언 뽑기</div>

  <div class="subtitle">
    오늘의 마음에 필요한 한마디를 뽑아보세요.
  </div>

  <div class="date" id="today"></div>

  <div class="card">

    <div id="result">
      <div class="loading">
        명언을 불러오는 중이에요...
      </div>
    </div>

  </div>

  <button id="drawButton" disabled>
    오늘의 명언 뽑기
  </button>

  <div class="notice" id="notice">
    하루에 한 번만 뽑을 수 있어요.
  </div>

</div>


<script>

  // ==========================================
  // 기본 설정
  // ==========================================

  const STORAGE_KEY = "today_quote_result";

  const todayElement = document.getElementById("today");
  const resultElement = document.getElementById("result");
  const drawButton = document.getElementById("drawButton");
  const noticeElement = document.getElementById("notice");

  let quotes = [];


  // ==========================================
  // 오늘 날짜
  // ==========================================

  function getToday() {

    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  function displayToday() {

    const today = getToday();

    const [year, month, day] = today.split("-");

    todayElement.textContent =
      `${year}년 ${Number(month)}월 ${Number(day)}일`;

  }


  // ==========================================
  // 명언 표시
  // ==========================================

  function showQuote(quote) {

    resultElement.innerHTML = `

      <div class="message">
        “${quote.text}”
      </div>

      <div class="author">
        — ${quote.author}
      </div>

      ${
        quote.category
        ? `<div class="category">${quote.category}</div>`
        : ""
      }

    `;

  }


  // ==========================================
  // 이미 오늘 뽑았는지 확인
  // ==========================================

  function checkTodayResult() {

    const saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {
      return false;
    }

    try {

      const data = JSON.parse(saved);

      if (data.date === getToday()) {

        showQuote(data.quote);

        drawButton.disabled = true;
        drawButton.textContent = "오늘의 명언을 뽑았습니다";

        noticeElement.textContent =
          "오늘은 이미 명언을 뽑았어요. 내일 다시 만나요.";

        return true;
      }

    } catch (error) {

      console.log("저장된 데이터 확인 오류:", error);

    }

    return false;
  }


  // ==========================================
  // 명언 뽑기
  // ==========================================

  function drawQuote() {

    if (!quotes || quotes.length === 0) {

      resultElement.innerHTML = `
        <div class="error">
          명언 데이터를 불러오지 못했어요.
        </div>
      `;

      return;
    }


    // 혹시 오늘 이미 뽑았다면 다시 뽑지 않음
    if (checkTodayResult()) {
      return;
    }


    // 랜덤 명언 선택
    const randomIndex =
      Math.floor(Math.random() * quotes.length);

    const selectedQuote = quotes[randomIndex];


    // 화면에 표시
    showQuote(selectedQuote);


    // 오늘 뽑은 명언 저장
    const saveData = {

      date: getToday(),

      quote: selectedQuote

    };


    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(saveData)
    );


    // 버튼 비활성화
    drawButton.disabled = true;

    drawButton.textContent =
      "오늘의 명언을 뽑았습니다";


    noticeElement.textContent =
      "오늘은 여기까지예요. 내일 새로운 명언을 뽑아보세요.";

  }


  // ==========================================
  // quotes.json 불러오기
  // ==========================================

  async function loadQuotes() {

    try {

      const response =
        await fetch("./quotes.json?ver=1");

      if (!response.ok) {

        throw new Error(
          `HTTP 오류: ${response.status}`
        );

      }


      quotes = await response.json();


      // 데이터가 배열인지 확인
      if (!Array.isArray(quotes)) {

        throw new Error(
          "quotes.json 형식이 올바르지 않습니다."
        );

      }


      console.log(
        `명언 ${quotes.length}개를 불러왔습니다.`
      );


      // 이미 오늘 뽑았는지 확인
      const alreadyDrawn =
        checkTodayResult();


      if (!alreadyDrawn) {

        drawButton.disabled = false;

      }

    } catch (error) {

      console.error(
        "명언 데이터 불러오기 실패:",
        error
      );


      resultElement.innerHTML = `

        <div class="error">

          명언 데이터를 불러오지 못했어요.<br>
          잠시 후 다시 시도해주세요.

        </div>

      `;

      drawButton.disabled = true;

      noticeElement.textContent =
        "quotes.json 파일을 확인해주세요.";

    }

  }


  // ==========================================
  // 시작
  // ==========================================

  displayToday();

  drawButton.addEventListener(
    "click",
    drawQuote
  );

  loadQuotes();

</script>

</body>
</html>
