<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 명언 뽑기</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #f4f1e8, #e8efe3);
  font-family: Arial, sans-serif;
  color: #333;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 480px;
  text-align: center;
}

h1 {
  font-size: 32px;
  margin: 0 0 10px;
  color: #38513b;
}

.subtitle {
  font-size: 15px;
  color: #777;
  margin-bottom: 25px;
}

.card {
  background: #fffdf7;
  border-radius: 24px;
  padding: 40px 28px;
  min-height: 330px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: 0 12px 35px rgba(0,0,0,0.10);
  border: 1px solid #e4e0d5;
}

.category {
  display: inline-block;
  margin: 0 auto 22px;
  padding: 7px 14px;
  border-radius: 20px;
  background: #e5eee1;
  color: #4d684f;
  font-size: 13px;
}

.quote {
  font-size: 23px;
  line-height: 1.7;
  font-weight: 600;
  word-break: keep-all;
  margin-bottom: 22px;
}

.author {
  font-size: 15px;
  color: #888;
}

button {
  width: 100%;
  border: none;
  border-radius: 15px;
  padding: 16px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}

.draw-button {
  background: #58745a;
  color: white;
}

.draw-button:active {
  transform: scale(0.98);
}

.save-button {
  background: #e8e3d6;
  color: #4d4d4d;
}

.message {
  min-height: 22px;
  margin-top: 12px;
  font-size: 13px;
  color: #777;
}

.footer {
  margin-top: 20px;
  font-size: 12px;
  color: #999;
}
</style>
</head>

<body>

<div class="container">

  <h1>오늘의 명언 뽑기</h1>
  <div class="subtitle">
    지금 당신에게 필요한 한마디를 뽑아보세요
  </div>

  <div class="card">
    <div class="category" id="category">오늘의 마음</div>

    <div class="quote" id="quote">
      마음을 다잡고<br>
      아래 버튼을 눌러보세요.
    </div>

    <div class="author" id="author"></div>
  </div>

  <button class="draw-button" onclick="drawQuote()">
    ✨ 오늘의 명언 뽑기
  </button>

  <button class="save-button" onclick="saveQuote()">
    💾 마음에 담기
  </button>

  <div class="message" id="message"></div>

  <div class="footer">
    하루에 한 번, 당신에게 필요한 한마디
  </div>

</div>

<script>

const quotes = [

  {
    text: "시작이 반이다.",
    author: "속담",
    category: "새로운 시작"
  },

  {
    text: "오늘 걷지 않으면 내일은 뛰어야 한다.",
    author: "카를레스 푸욜",
    category: "도전"
  },

  {
    text: "성공은 실패를 거듭해도 열정을 잃지 않는 것이다.",
    author: "윈스턴 처칠",
    category: "힘이 필요해요"
  },

  {
    text: "행복은 준비된 마음에서 시작된다.",
    author: "알 수 없음",
    category: "행복한 하루"
  },

  {
    text: "당신이 할 수 있다고 믿든 할 수 없다고 믿든, 당신이 옳다.",
    author: "헨리 포드",
    category: "도전"
  },

  {
    text: "작은 변화가 큰 차이를 만든다.",
    author: "알 수 없음",
    category: "새로운 시작"
  },

  {
    text: "때로는 천천히 가는 것이 가장 빠른 길이다.",
    author: "알 수 없음",
    category: "위로"
  },

  {
    text: "삶은 우리가 만드는 것이다.",
    author: "엘리너 루스벨트",
    category: "힘이 필요해요"
  },

  {
    text: "어제보다 나은 오늘을 만들면 된다.",
    author: "알 수 없음",
    category: "새로운 시작"
  },

  {
    text: "당신의 가능성에는 끝이 없다.",
    author: "알 수 없음",
    category: "도전"
  },

  {
    text: "가장 어두운 밤도 지나간다.",
    author: "윌리엄 셰익스피어",
    category: "위로"
  },

  {
    text: "사랑은 나눌수록 커진다.",
    author: "알 수 없음",
    category: "사랑"
  },

  {
    text: "오늘이라는 선물에 감사하자.",
    author: "알 수 없음",
    category: "행복한 하루"
  },

  {
    text: "포기하지 않는 사람에게는 끝이 없다.",
    author: "알 수 없음",
    category: "힘이 필요해요"
  },

  {
    text: "당신은 생각보다 훨씬 강하다.",
    author: "알 수 없음",
    category: "위로"
  }

];

let currentQuote = null;

function drawQuote() {

  const randomIndex =
    Math.floor(Math.random() * quotes.length);

  currentQuote = quotes[randomIndex];

  document.getElementById("category").textContent =
    currentQuote.category;

  document.getElementById("quote").textContent =
    "“" + currentQuote.text + "”";

  document.getElementById("author").textContent =
    "— " + currentQuote.author;

  document.getElementById("message").textContent =
    "";

}


async function saveQuote() {

  if (!currentQuote) {

    document.getElementById("message").textContent =
      "먼저 명언을 하나 뽑아주세요.";

    return;
  }

  const canvas =
    document.createElement("canvas");

  const width = 1080;
  const height = 1350;

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#fffdf7";
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = "#58745a";
  ctx.font = "bold 42px Arial";
  ctx.textAlign = "center";

  ctx.fillText(
    currentQuote.category,
    width / 2,
    250
  );

  ctx.fillStyle = "#333";

  ctx.font = "bold 58px Arial";

  const words =
    currentQuote.text.split("");

  let lines = [];
  let line = "";

  for (let char of words) {

    const testLine =
      line + char;

    const measurement =
      ctx.measureText(testLine);

    if (measurement.width > 850) {

      lines.push(line);
      line = char;

    } else {

      line = testLine;

    }

  }

  if (line) {
    lines.push(line);
  }

  let startY =
    520 - ((lines.length - 1) * 35);

  lines.forEach(function(lineText) {

    ctx.fillText(
      lineText,
      width / 2,
      startY
    );

    startY += 100;

  });

  ctx.font = "32px Arial";
  ctx.fillStyle = "#888";

  ctx.fillText(
    "— " + currentQuote.author,
    width / 2,
    850
  );

  ctx.font = "26px Arial";
  ctx.fillStyle = "#aaa";

  ctx.fillText(
    "오늘의 명언 뽑기",
    width / 2,
    1150
  );

  canvas.toBlob(function(blob) {

    if (!blob) {

      document.getElementById("message").textContent =
        "이미지를 만들 수 없습니다.";

      return;
    }

    const url =
      URL.createObjectURL(blob);

    const link =
      document.createElement("a");

    link.href = url;
    link.download = "오늘의명언.png";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    setTimeout(function() {

      URL.revokeObjectURL(url);

    }, 1000);

    document.getElementById("message").textContent =
      "명언 이미지가 저장되었습니다.";

  }, "image/png");

}

</script>

</body>
</html>
