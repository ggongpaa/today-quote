<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>오늘의 명언 뽑기</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#71866d">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: #f5f1e8;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;

      color: #3d463d;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 15px;
    }


    /* ==========================================
       전체 컨테이너
       ========================================== */

    .container {
      width: 100%;
      max-width: 500px;

      text-align: center;
    }


    /* ==========================================
       제목
       ========================================== */

    .title {
      font-size: 30px;
      font-weight: 700;

      margin-bottom: 8px;

      color: #425443;
    }


    .subtitle {
      font-size: 15px;

      color: #777;

      margin-bottom: 18px;

      line-height: 1.6;
    }


    .date {
      font-size: 14px;

      color: #7b8178;

      margin-bottom: 25px;
    }


    /* ==========================================
       카드 영역
       ========================================== */

    .card-wrapper {

      width: 100%;

      display: flex;
      justify-content: center;

      perspective: 1200px;

      margin-bottom: 20px;
    }


    /* ==========================================
       실제 뒤집히는 카드
       ========================================== */

    .quote-card {

      width: min(82vw, 330px);

      aspect-ratio: 0.68;

      position: relative;

      cursor: pointer;

      transform-style: preserve-3d;

      transition:
        transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);

      -webkit-tap-highlight-color: transparent;

      user-select: none;
    }


    /* 카드 뒤집힘 */

    .quote-card.flipped {

      transform: rotateY(180deg);

    }


    /* ==========================================
       카드 앞 / 뒤 공통
       ========================================== */

    .card-face {

      position: absolute;

      width: 100%;
      height: 100%;

      top: 0;
      left: 0;

      border-radius: 24px;

      overflow: hidden;

      backface-visibility: hidden;

      -webkit-backface-visibility: hidden;

      box-shadow:
        0 15px 35px rgba(70, 70, 50, 0.16);
    }


    /* ==========================================
       카드 앞면
       ========================================== */

    .card-front {

      background:
        radial-gradient(
          circle at center,
          #82977d 0%,
          #71866d 45%,
          #5e735b 100%
        );

      color: white;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      padding: 30px;

      border: 8px solid rgba(255,255,255,0.18);
    }


    /* 카드 안쪽 장식 */

    .card-front::before {

      content: "";

      position: absolute;

      inset: 14px;

      border: 1px solid rgba(255,255,255,0.35);

      border-radius: 18px;

      pointer-events: none;
    }


    .star {

      font-size: 28px;

      margin-bottom: 25px;

      opacity: 0.9;
    }


    .front-title {

      font-size: 28px;

      font-weight: 700;

      letter-spacing: 2px;

      margin-bottom: 14px;
    }


    .front-subtitle {

      font-size: 14px;

      opacity: 0.9;

      letter-spacing: 1px;
    }


    .tap-text {

      position: absolute;

      bottom: 30px;

      font-size: 12px;

      letter-spacing: 1px;

      opacity: 0.75;
    }


    /* ==========================================
       카드 뒷면 = 명언
       ========================================== */

    .card-back {

      transform: rotateY(180deg);

      background: #fffdf8;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      padding: 35px 28px;

      text-align: center;

      border: 1px solid #e6e0d5;
    }


    .quote-mark {

      font-family: Georgia, serif;

      font-size: 55px;

      line-height: 0.7;

      color: #71866d;

      margin-bottom: 18px;
    }


    .message {

      font-size: 19px;

      line-height: 1.8;

      font-weight: 500;

      word-break: keep-all;

      color: #3d463d;

      margin-bottom: 22px;
    }


    .author {

      font-size: 14px;

      color: #777;

      margin-bottom: 12px;
    }


    .category {

      display: inline-block;

      padding: 6px 13px;

      border-radius: 20px;

      background: #e8eee5;

      color: #5d6c5a;

      font-size: 12px;
    }


    /* ==========================================
       안내 문구
       ========================================== */

    .notice {

      font-size: 13px;

      color: #888;

      line-height: 1.7;

      min-height: 45px;
    }


    .loading {

      color: #888;

      font-size: 15px;
    }


    .error {

      color: #a05b5b;

      font-size: 14px;

      line-height: 1.6;
    }


    /* ==========================================
       카드 등장 애니메이션
       ========================================== */

    .quote-card.ready {

      animation:
        cardAppear 0.7s ease-out;
    }


    @keyframes cardAppear {

      from {

        opacity: 0;

        transform:
          translateY(20px)
          scale(0.96);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    /* ==========================================
       클릭 유도용 살짝 움직임
       ========================================== */

    .quote-card:not(.flipped):not(.disabled) {

      animation:
        gentleFloat 2.8s ease-in-out infinite;
    }


    @keyframes gentleFloat {

      0%, 100% {

        transform:
          translateY(0);
      }

      50% {

        transform:
          translateY(-6px);
      }

    }


    /* 뒤집힌 후에는 애니메이션 제거 */

    .quote-card.flipped {

      animation: none;
    }


    /* ==========================================
       이미 오늘 뽑은 경우
       ========================================== */

    .quote-card.disabled {

      cursor: default;
    }


    /* ==========================================
       모바일
       ========================================== */

    @media (max-width: 400px) {

      .title {
        font-size: 27px;
      }

      .subtitle {
        font-size: 14px;
      }

      .quote-card {
        width: min(84vw, 310px);
      }

      .message {
        font-size: 17px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- 제목 -->

  <div class="title">
    오늘의 명언 뽑기
  </div>


  <div class="subtitle">
    오늘의 마음에 필요한 한마디를 뽑아보세요.
  </div>


  <!-- 날짜 -->

  <div
    class="date"
    id="today">
  </div>


  <!-- ========================================
       카드
       ======================================== -->

  <div class="card-wrapper">

    <div
      class="quote-card"
      id="quoteCard">


      <!-- ====================================
           카드 앞면
           ==================================== -->

      <div class="card-face card-front">

        <div class="star">
          ✦
        </div>

        <div class="front-title">
          오늘의<br>
          마음
        </div>

        <div class="front-subtitle">
          한 장의 카드를 뽑아보세요
        </div>

        <div class="tap-text">
          TAP TO DRAW
        </div>

      </div>


      <!-- ====================================
           카드 뒷면
           ==================================== -->

      <div class="card-face card-back">

        <div id="result">

          <div class="loading">
            명언을 불러오는 중이에요...
          </div>

        </div>

      </div>


    </div>

  </div>


  <!-- 안내 -->

  <div
    class="notice"
    id="notice">

    카드를 눌러 오늘의 명언을 뽑아보세요.

  </div>


</div>



<script>


  // ==========================================
  // 기본 설정
  // ==========================================

  const STORAGE_KEY =
    "today_quote_result";


  const todayElement =
    document.getElementById("today");


  const resultElement =
    document.getElementById("result");


  const quoteCard =
    document.getElementById("quoteCard");


  const noticeElement =
    document.getElementById("notice");


  let quotes = [];

  let isDrawing = false;



  // ==========================================
  // 오늘 날짜
  // ==========================================

  function getToday() {

    const now = new Date();

    const year =
      now.getFullYear();

    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        now.getDate()
      ).padStart(2, "0");


    return `${year}-${month}-${day}`;

  }



  function displayToday() {

    const today =
      getToday();

    const [
      year,
      month,
      day
    ] = today.split("-");


    todayElement.textContent =
      `${year}년 ${Number(month)}월 ${Number(day)}일`;

  }



  // ==========================================
  // 명언 표시
  // ==========================================

  function showQuote(quote) {

    resultElement.innerHTML = `

      <div class="quote-mark">
        “
      </div>

      <div class="message">
        ${quote.text}
      </div>

      <div class="author">
        — ${quote.author}
      </div>

      ${
        quote.category
        ?
        `<div class="category">
          ${quote.category}
        </div>`
        :
        ""
      }

    `;

  }



  // ==========================================
  // 오늘 이미 뽑았는지 확인
  // ==========================================

  function getSavedResult() {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (!saved) {

      return null;

    }


    try {

      const data =
        JSON.parse(saved);


      if (
        data.date ===
        getToday()
      ) {

        return data.quote;

      }

    } catch (error) {

      console.log(
        "저장된 데이터 확인 오류:",
        error
      );

    }


    return null;

  }



  // ==========================================
  // 오늘의 명언 뽑기
  // ==========================================

  function drawQuote() {


    if (isDrawing) {

      return;

    }


    if (
      !quotes ||
      quotes.length === 0
    ) {

      return;

    }


    // 오늘 이미 뽑았다면 종료

    const savedQuote =
      getSavedResult();


    if (savedQuote) {

      showQuote(
        savedQuote
      );

      quoteCard.classList.add(
        "flipped"
      );

      quoteCard.classList.add(
        "disabled"
      );

      noticeElement.textContent =
        "오늘은 이미 명언을 뽑았어요. 내일 다시 만나요.";

      return;

    }


    isDrawing = true;


    // 랜덤 명언 선택

    const randomIndex =
      Math.floor(
        Math.random() *
        quotes.length
      );


    const selectedQuote =
      quotes[randomIndex];


    // 명언 저장

    const saveData = {

      date: getToday(),

      quote: selectedQuote

    };


    localStorage.setItem(

      STORAGE_KEY,

      JSON.stringify(
        saveData
      )

    );


    // 카드 뒷면에 명언 넣기

    showQuote(
      selectedQuote
    );


    // 잠깐 기다렸다가 카드 뒤집기

    setTimeout(() => {

      quoteCard.classList.add(
        "flipped"
      );

      quoteCard.classList.add(
        "disabled"
      );


      noticeElement.textContent =
        "오늘의 명언을 마음에 담아보세요. 내일 새로운 카드를 뽑을 수 있어요.";


      isDrawing = false;

    }, 80);

  }



  // ==========================================
  // quotes.json 불러오기
  // ==========================================

  async function loadQuotes() {


    try {

      const response =
        await fetch(
          "./quotes.json?ver=2"
        );


      if (!response.ok) {

        throw new Error(
          `HTTP 오류: ${response.status}`
        );

      }


      quotes =
        await response.json();


      if (
        !Array.isArray(quotes)
      ) {

        throw new Error(
          "quotes.json 형식이 올바르지 않습니다."
        );

      }


      console.log(
        `명언 ${quotes.length}개를 불러왔습니다.`
      );


      // 오늘 이미 뽑았다면
      // 기존 명언을 바로 보여줌

      const savedQuote =
        getSavedResult();


      if (savedQuote) {

        showQuote(
          savedQuote
        );


        // 카드가 이미 뒤집힌 상태

        quoteCard.classList.add(
          "flipped"
        );


        quoteCard.classList.add(
          "disabled"
        );


        noticeElement.textContent =
          "오늘은 이미 명언을 뽑았어요. 내일 다시 만나요.";

      }
      else {

        // 새 카드

        quoteCard.classList.add(
          "ready"
        );


        noticeElement.textContent =
          "카드를 눌러 오늘의 명언을 뽑아보세요.";

      }


    } catch (error) {

      console.error(
        "명언 데이터 불러오기 실패:",
        error
      );


      resultElement.innerHTML = `

        <div class="error">

          명언 데이터를 불러오지 못했어요.<br>
          잠시 후 다시 시도해주세요.

        </div>

      `;


      noticeElement.textContent =
        "quotes.json 파일을 확인해주세요.";

    }

  }



  // ==========================================
  // 카드 클릭
  // ==========================================

  quoteCard.addEventListener(
    "click",
    drawQuote
  );



  // ==========================================
  // 시작
  // ==========================================

  displayToday();

  loadQuotes();



  // ==========================================
  // 서비스 워커
  // ==========================================

  if (
    "serviceWorker" in navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register("./sw.js")

          .then(
            (reg) => {

              console.log(
                "Service Worker Registered:",
                reg.scope
              );

            }
          )

          .catch(
            (err) => {

              console.error(
                "Service Worker Registration Failed:",
                err
              );

            }
          );

      }
    );

  }


</script>


</body>
</html>
